<!-- register.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - LifeConnect</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/forms.css">
    <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
    <div class="auth-wrapper container">
        <div class="form-container card my-5">
            <h2>User Registration</h2>
            <form id="registerForm">
                <div class="form-group">
                    <label for="regName">Full Name</label>
                    <input type="text" id="regName" required placeholder="Full Name">
                </div>
                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input type="email" id="regEmail" required placeholder="name@example.com">
                </div>
                <div class="form-group">
                    <label for="regMobile">Mobile Number</label>
                    <input type="tel" id="regMobile" pattern="[6-9][0-9]{9}" required placeholder="10-digit mobile">
                </div>
                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input type="password" id="regPassword" required placeholder="******">
                </div>
                <button type="submit" class="btn btn-primary btn-block">Register</button>
                <p class="mt-3 text-center">Already have an account? <a href="login.html">Login here</a></p>
            </form>
        </div>
    </div>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
